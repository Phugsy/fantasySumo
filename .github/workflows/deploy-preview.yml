name: Deploy Preview

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA or ref to deploy to preview
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  resolve:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      branch: ${{ steps.commit.outputs.branch }}
      playwright_image: ${{ steps.commit.outputs.playwright_image }}
    steps:
      - name: Check out requested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.ref }}
          fetch-depth: 0

      - name: Record immutable commit
        id: commit
        env:
          PREVIEW_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || '' }}
        run: |
          playwright_version=$(awk '/@playwright\/test/{found=1; next} found && $1 == "version:" {version=$2; sub(/\(.*/, "", version); print version; exit}' pnpm-lock.yaml)
          if [[ ! "$playwright_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unable to resolve an exact Playwright version from pnpm-lock.yaml." >&2
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "branch=$PREVIEW_BRANCH" >> "$GITHUB_OUTPUT"
          echo "playwright_image=mcr.microsoft.com/playwright:v${playwright_version}-noble" >> "$GITHUB_OUTPUT"

  validate:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out resolved commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run main validation
        run: make check

  e2e:
    needs:
      - resolve
      - validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ${{ needs.resolve.outputs.playwright_image }}
      options: --ipc=host
    steps:
      - name: Check out resolved commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run browser E2E
        run: pnpm e2e

  deploy:
    needs:
      - resolve
      - validate
      - e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: fantasy-sumo-preview-database
      cancel-in-progress: false
    environment:
      name: Preview
      url: ${{ steps.deploy.outputs.url }}
    env:
      DEPLOY_SHA: ${{ needs.resolve.outputs.sha }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Check out workflow smoke tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .workflow-tools
          sparse-checkout: scripts/smoke-deployment.mjs
          sparse-checkout-cone-mode: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel preview configuration
        env:
          PREVIEW_BRANCH: ${{ needs.resolve.outputs.branch }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          pull_args=(pull --yes --environment=preview --token="$VERCEL_TOKEN")
          if [[ -n "$PREVIEW_BRANCH" ]]; then
            pull_args+=(--git-branch="$PREVIEW_BRANCH")
          fi
          pnpm dlx vercel@56.3.2 "${pull_args[@]}"

      - name: Build prepared preview deployment
        run: pnpm dlx vercel@56.3.2 build

      - name: Type-check Vercel function entrypoint
        run: pnpm exec tsc -p tsconfig.json

      - name: Require current pull request head
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_SHA: ${{ needs.resolve.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)
          if [[ "$current_sha" != "$EXPECTED_SHA" ]]; then
            echo "Refusing to deploy stale commit $EXPECTED_SHA; pull request head is $current_sha." >&2
            exit 1
          fi

      - name: Apply preview database migrations
        id: migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
        run: |
          pnpm db:migrate
          echo "result=success" >> "$GITHUB_OUTPUT"

      - name: Deploy tested preview build
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          deployment_url=$(pnpm dlx vercel@56.3.2 deploy --prebuilt --token="$VERCEL_TOKEN" --meta githubCommitSha="$DEPLOY_SHA" | tail -n 1)
          case "$deployment_url" in
            https://*) ;;
            *) echo "Vercel returned an invalid deployment URL" >&2; exit 1 ;;
          esac
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Smoke-test preview deployment
        id: smoke
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node .workflow-tools/scripts/smoke-deployment.mjs "$DEPLOYMENT_URL"

      - name: Write preview deployment summary
        if: always()
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          MIGRATION_RESULT: ${{ steps.migrate.outcome }}
          SMOKE_RESULT: ${{ steps.smoke.outcome }}
        run: |
          echo "## Preview deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: preview" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit SHA: \`$DEPLOY_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Migration result: ${MIGRATION_RESULT:-not-run}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deployment URL: ${DEPLOYMENT_URL:-not-created}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Smoke-test result: ${SMOKE_RESULT:-not-run}" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$MIGRATION_RESULT" == "success" && "$SMOKE_RESULT" != "success" ]]; then
            echo "- Recovery: the database may already be ahead; fix forward or redeploy code compatible with the advanced schema. Do not run down migrations automatically." >> "$GITHUB_STEP_SUMMARY"
          fi
